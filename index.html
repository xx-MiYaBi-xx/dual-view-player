<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%22-10%20-10%20140%20140%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20role%3D%22img%22%20aria-label%3D%22MiYaBi%20Software%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22fvg%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%237df3ff%22%2F%3E%3Cstop%20offset%3D%22.55%22%20stop-color%3D%22%238fa8ff%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23c39bff%22%2F%3E%3C%2FlinearGradient%3E%3ClinearGradient%20id%3D%22fvf%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%220%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%2316356f%22%20stop-opacity%3D%22.85%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230a1230%22%20stop-opacity%3D%22.95%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Cpath%20%20d%3D%22M60%20-6%20L126%2060%20L60%20126%20L-6%2060%20Z%22%20fill%3D%22none%22%20stroke%3D%22%237da2ff%22%20stroke-opacity%3D%22.35%22%20stroke-width%3D%22.8%22%20stroke-dasharray%3D%222%204%22%2F%3E%3Cpath%20%20d%3D%22M60%206%20L114%2060%20L60%20114%20L6%2060%20Z%22%20fill%3D%22url%28%23fvf%29%22%20stroke%3D%22url%28%23fvg%29%22%20stroke-width%3D%223.2%22%20stroke-linejoin%3D%22round%22%20pathLength%3D%221%22%2F%3E%3Cpath%20d%3D%22M60%2015%20L105%2060%20L60%20105%20L15%2060%20Z%22%20fill%3D%22none%22%20stroke%3D%22url%28%23fvg%29%22%20stroke-opacity%3D%22.4%22%20stroke-width%3D%22.9%22%2F%3E%3Cpath%20%20d%3D%22M33%2080%20V47%20L60%2072%20L87%2047%20V80%22%20fill%3D%22none%22%20stroke%3D%22url%28%23fvg%29%22%20stroke-width%3D%229%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20pathLength%3D%221%22%2F%3E%3Cpath%20%20d%3D%22M60%2030%20C68%2038%2068%2047%2060%2053%20C52%2047%2052%2038%2060%2030%20Z%22%20fill%3D%22%23ff7ab8%22%2F%3E%3Ccircle%20%20cx%3D%2260%22%20cy%3D%2241%22%20r%3D%222.2%22%20fill%3D%22%23ffd1e6%22%2F%3E%3C%2Fsvg%3E">
<title>MiYaBi Software</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Yu Gothic UI","Hiragino Sans","Meiryo",system-ui,sans-serif;color:#e8f0ff;background:#050b1a;line-height:1.8;font-size:16px;overflow-x:hidden}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px;position:relative;z-index:2}

/* ---------- 背景(オーロラ + グリッド) ---------- */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;will-change:transform}
.bg .b1{width:620px;height:620px;left:-160px;top:-180px;background:#1e6fdc;animation:f1 18s ease-in-out infinite}
.bg .b2{width:560px;height:560px;right:-140px;top:120px;background:#7a4dff;animation:f2 22s ease-in-out infinite}
.bg .b3{width:520px;height:520px;left:30%;bottom:-260px;background:#00c2ff;opacity:.35;animation:f1 26s ease-in-out infinite reverse}
.bg .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(120,170,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,255,.07) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%)}
@keyframes f1{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,50px)}}
@keyframes f2{0%,100%{transform:translate(0,0)}50%{transform:translate(-80px,60px)}}

/* ---------- ヒーロー ---------- */
header.hero{position:relative;z-index:2;text-align:center;padding:96px 0 30px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12.5px;letter-spacing:.38em;color:#8fd0ff;text-transform:uppercase;border:1px solid rgba(143,208,255,.35);border-radius:999px;padding:4px 18px;background:rgba(40,100,200,.15);backdrop-filter:blur(6px)}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:#46f0b4;box-shadow:0 0 10px #46f0b4;animation:blink 2s infinite}
@keyframes blink{50%{opacity:.25}}
h1.brand{margin:22px 0 0;font-size:clamp(52px,12vw,128px);font-weight:900;letter-spacing:.06em;line-height:1;background:linear-gradient(100deg,#7df3ff 0%,#fff 30%,#b9a8ff 55%,#7df3ff 80%,#fff 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:sheen 7s linear infinite;filter:drop-shadow(0 0 28px rgba(80,160,255,.55))}
@keyframes sheen{to{background-position:-220% 0}}
.sub{margin:10px 0 0;letter-spacing:.62em;font-size:clamp(12px,2.2vw,16px);color:#9fc4ff;font-weight:700;padding-left:.62em}
.catch{margin:26px auto 0;max-width:640px;color:#c9daf7;font-size:clamp(15px,2.4vw,18px)}
.cta{display:inline-block;margin-top:30px;padding:14px 40px;border-radius:999px;color:#04122b;font-weight:800;text-decoration:none;background:linear-gradient(90deg,#7df3ff,#9db8ff);box-shadow:0 0 0 1px rgba(255,255,255,.4) inset,0 10px 34px rgba(80,160,255,.55);transition:transform .15s,box-shadow .15s}
.cta:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,.6) inset,0 14px 44px rgba(110,190,255,.8)}

@keyframes rgb{to{filter:hue-rotate(360deg)}}


/* ---------- ロゴ ---------- */
.emblem{width:clamp(150px,26vw,230px);margin:0 auto 6px;position:relative}
.emblem:before{content:"";position:absolute;inset:-18%;background:radial-gradient(circle,rgba(125,200,255,.55),rgba(150,110,255,.25) 45%,transparent 70%);filter:blur(14px);animation:pulse 4.5s ease-in-out infinite}
.emblem svg{position:relative;display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 0 14px rgba(110,180,255,.7))}
.emblem .ring{transform-origin:60px 60px;animation:spin 40s linear infinite}
.emblem .rh,.emblem .mm{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.5s cubic-bezier(.6,0,.2,1) both}
.emblem .mm{animation-delay:.7s}
.emblem .pt{transform-origin:60px 41px;animation:pop .8s 1.7s cubic-bezier(.3,1.6,.5,1) both,glow 3.2s 2.5s ease-in-out infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes glow{50%{filter:drop-shadow(0 0 7px #ff7ab8)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.55;transform:scale(1.08)}}
.sub{display:flex;align-items:center;justify-content:center;gap:16px}
.sub i{width:clamp(30px,8vw,80px);height:1px;background:linear-gradient(90deg,transparent,#7da2ff)}
.sub i:last-child{transform:scaleX(-1)}
h1.brand{margin-top:10px}

/* ---------- 一覧 ---------- */
section{position:relative;z-index:2;padding:70px 0 20px}
.sec-title{display:flex;align-items:center;gap:14px;margin:0 0 22px;font-size:clamp(22px,4vw,30px);letter-spacing:.12em}
.sec-title:before{content:"";width:34px;height:3px;background:linear-gradient(90deg,#7df3ff,#b9a8ff);border-radius:2px}
.sec-title small{font-size:.5em;letter-spacing:.3em;color:#7da2d6}
.lead{color:#9db4d8;margin:0 0 26px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}

.app{position:relative;border-radius:20px;padding:1px;background:linear-gradient(140deg,rgba(125,243,255,.55),rgba(255,255,255,.06) 40%,rgba(185,168,255,.55));transition:transform .2s,box-shadow .25s;opacity:0;transform:translateY(24px)}
.app.in{opacity:1;transform:none;transition:opacity .7s,transform .7s,box-shadow .25s}
.app:hover{transform:translateY(-6px);box-shadow:0 20px 56px rgba(60,140,255,.38)}
.app .inner{background:linear-gradient(180deg,rgba(18,34,70,.92),rgba(9,18,40,.95));border-radius:19px;overflow:hidden;height:100%;display:flex;flex-direction:column}
.app .top{height:130px;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900;color:#fff;position:relative;background:radial-gradient(240px 120px at 50% 120%,rgba(70,160,255,.7),transparent),linear-gradient(135deg,#0d2a5c,#1b4fa8 70%,#2f86e8)}
.app .top:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%);transform:translateX(-120%);transition:transform .8s}
.app:hover .top:after{transform:translateX(120%)}
.app .top .ic{height:88px;width:auto;filter:drop-shadow(0 6px 16px rgba(0,10,40,.6));transition:transform .3s}
.app:hover .top .ic{transform:scale(1.1) translateY(-2px)}
.app .in2{padding:18px 20px 22px;display:flex;flex-direction:column;flex:1}
.app h3{margin:0;font-size:21px;letter-spacing:.03em}
.app h3 .new{display:inline-block;vertical-align:middle;margin-left:10px;font-size:11px;font-weight:900;letter-spacing:.12em;color:#fff;background:linear-gradient(90deg,#ff2e93,#ff7a4d);border-radius:6px;padding:1px 9px;line-height:1.6;box-shadow:0 0 14px rgba(255,60,140,.7);animation:newp 1.8s ease-in-out infinite}
@keyframes newp{50%{box-shadow:0 0 4px rgba(255,60,140,.3);transform:translateY(-1px)}}
.app .ver{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.06em;color:#46f0b4;border:1px solid rgba(70,240,180,.45);background:rgba(70,240,180,.1);border-radius:999px;padding:0 11px;margin:6px 0 4px}
.app p{margin:6px 0 18px;color:#a9bddb;font-size:14.5px;flex:1}
.app a.go{align-self:flex-start;text-decoration:none;color:#04122b;font-weight:800;padding:10px 26px;border-radius:999px;background:linear-gradient(90deg,#7df3ff,#9db8ff);font-size:14.5px;transition:box-shadow .2s,transform .2s}
.app a.go:hover{box-shadow:0 8px 26px rgba(120,190,255,.6);transform:translateX(3px)}
.app a.go:after{content:" →"}
.state{color:#7da2d6;font-size:13.5px;margin-top:14px}

footer{position:relative;z-index:2;margin-top:80px;border-top:1px solid rgba(143,208,255,.18);text-align:center;padding:30px 0 40px;font-size:14px;color:#7da2d6;letter-spacing:.08em}
footer a{color:#9fd4ff}

@media (max-width:600px){header.hero{padding-top:60px}.list{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.app{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grid"></div></div>

<header class="hero"><div class="wrap">
  <div class="emblem" aria-hidden="true"><svg viewBox="-10 -10 140 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MiYaBi Software"><defs><linearGradient id="hmg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7df3ff"/><stop offset=".55" stop-color="#8fa8ff"/><stop offset="1" stop-color="#c39bff"/></linearGradient><linearGradient id="hmf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16356f" stop-opacity=".85"/><stop offset="1" stop-color="#0a1230" stop-opacity=".95"/></linearGradient></defs><path class="ring" d="M60 -6 L126 60 L60 126 L-6 60 Z" fill="none" stroke="#7da2ff" stroke-opacity=".35" stroke-width=".8" stroke-dasharray="2 4"/><path class="rh" d="M60 6 L114 60 L60 114 L6 60 Z" fill="url(#hmf)" stroke="url(#hmg)" stroke-width="3.2" stroke-linejoin="round" pathLength="1"/><path d="M60 15 L105 60 L60 105 L15 60 Z" fill="none" stroke="url(#hmg)" stroke-opacity=".4" stroke-width=".9"/><path class="mm" d="M33 80 V47 L60 72 L87 47 V80" fill="none" stroke="url(#hmg)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/><path class="pt" d="M60 30 C68 38 68 47 60 53 C52 47 52 38 60 30 Z" fill="#ff7ab8"/><circle class="pt" cx="60" cy="41" r="2.2" fill="#ffd1e6"/></svg></div>
  <h1 class="brand" aria-label="MiYaBi Software">MiYaBi</h1>
  <div class="sub"><i></i>SOFTWARE<i></i></div>
  <p class="catch">暮らしと作業を、ちょっと便利に。<br>Windows 向けのソフトを、少しずつ増やしています。</p>
  <a class="cta" href="#apps">ソフトを見る</a>
</div></header>

<div class="wrap">
<section id="apps">
  <h2 class="sec-title">SOFTWARE <small>ソフト一覧</small></h2>
  <div class="list" id="list"></div>
  <div class="state" id="state"></div>
</section>
</div>

<footer>© MiYaBi ／ <a href="https://github.com/xx-MiYaBi-xx" target="_top" rel="noopener">GitHub</a></footer>

<script>
/* ===== ここだけ書き換えてください ===== */
var OWNER   = "xx-MiYaBi-xx";            /* GitHubのユーザー名 */
var TOPIC   = "miyabi-software";         /* 一覧に載せたいリポジトリに付けるタグ(トピック) */
/* GitHubに接続できないときに表示する予備の一覧(手書き) */
var FALLBACK = [
  {name:"MultiFullscreen", desc:"動画プレイヤーなどを、複数のモニターにまたがって全画面表示するソフトです。", url:"https://"+OWNER.toLowerCase()+".github.io/multifullscreen/", repo:"multifullscreen", ver:"1.11.2"}
];
var NEW_DAYS = 30;                       /* 公開・更新から何日間 NEW を表示するか */
/* 表示名(リポジトリ名 → きれいな名前)。無いソフトはリポジトリ名のまま表示 */
var NAMES = { "multifullscreen":"MultiFullscreen" };
/* ソフトごとのアイコン(リポジトリ名 → SVG)。無いソフトは頭文字を表示 */
var ICONS = {
  "multifullscreen": '<svg class="ic" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="mfT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64c8ff"/><stop offset="1" stop-color="#1e6edc"/></linearGradient></defs><rect x="1" y="3" width="30" height="20" fill="#263246"/><rect x="3.5" y="5.5" width="25" height="15" fill="url(#mfT)"/><g stroke="#ebffff" stroke-opacity=".92" stroke-width="1.6"><path d="M16 5.5V20.5"/><path d="M3.5 13H28.5"/></g><rect x="13.5" y="23" width="5" height="4" fill="#465264"/><rect x="8" y="27" width="16" height="3" fill="#465264"/></svg>'
};
/* ====================================== */
var list=document.getElementById("list"), state=document.getElementById("state");

function verOf(j){
  /* タグ名・リリース名・添付ファイル名の順に、1.11.2 のような番号を探す */
  var c=[j.tag_name,j.name].concat((j.assets||[]).map(function(x){return x.name;}));
  for(var i=0;i<c.length;i++){ var m=/(\d+(?:\.\d+)+)/.exec(String(c[i]||"")); if(m) return m[1]; }
  return "";
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

var io=("IntersectionObserver" in window)?new IntersectionObserver(function(es){
  es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } });
},{threshold:.15}):null;

function card(a,i){
  var d=document.createElement("div"); d.className="app"; d.style.transitionDelay=(i*90)+"ms";
  var key=String(a.repo||"").toLowerCase();
  var mark=ICONS[key]||esc((a.name||"?").charAt(0).toUpperCase());
  var title=NAMES[key]||a.name;
  d.innerHTML='<div class="inner"><div class="top">'+mark+'</div><div class="in2">'+
    '<h3>'+esc(title)+'<span class="new" style="display:none">NEW</span></h3><span class="ver">'+(a.ver?"最新版 v"+esc(a.ver):"最新版 確認中…")+'</span>'+
    '<p>'+esc(a.desc||"")+'</p>'+
    '<a class="go" href="'+esc(a.url)+'" target="_top" rel="noopener">使い方・ダウンロード</a></div></div>';
  list.appendChild(d);
  if(io) io.observe(d); else d.classList.add("in");
  /* 最新バージョンを自動表示 */
  if(a.repo){
    fetch("https://api.github.com/repos/"+OWNER+"/"+a.repo+"/releases/latest")
      .then(function(r){return r.json();})
      .then(function(j){
        if(j&&j.tag_name){
          var vv=verOf(j); if(vv) d.querySelector(".ver").textContent="最新版 v"+vv;
          /* 公開(または更新)から NEW_DAYS 日以内なら NEW を表示。過ぎると自動で消える */
          var ms=Date.parse(j.published_at||"");
          if(ms&&(Date.now()-ms)<=NEW_DAYS*86400000){ d.querySelector(".new").style.display=""; }
        }
      }).catch(function(){ var v=d.querySelector(".ver"); if(/確認中/.test(v.textContent)) v.textContent="最新版 ―"; });
  }
}

function render(items){
  list.innerHTML="";
  items.forEach(card);
  state.textContent="";
}

/* タグが付いた公開リポジトリを取得して一覧にする */
fetch("https://api.github.com/search/repositories?q=user:"+OWNER+"+topic:"+TOPIC+"&sort=updated&per_page=50")
  .then(function(r){ if(!r.ok) throw new Error("api"); return r.json(); })
  .then(function(j){
    var items=(j.items||[]).filter(function(r){
      return r.name.toLowerCase()!==(OWNER+".github.io").toLowerCase();   /* トップページ自身は除く */
    }).map(function(r){
      return {
        name:r.name, desc:r.description,
        repo:r.name,
        url:(r.homepage&&/^https?:/.test(r.homepage))?r.homepage:"https://"+OWNER.toLowerCase()+".github.io/"+r.name+"/"
      };
    });
    if(!items.length) throw new Error("empty");
    render(items);
  })
  .catch(function(){ render(FALLBACK); });
</script>
</body>
</html>
